<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CAPTCHA Deslizante - TCC</title>

    <link rel="stylesheet"
          href="/css/slider.css">

</head>

<body>

<div class="captcha-container">

    <div class="captcha-card">

        <div class="captcha-header">

            <div class="shield">
                🔒
            </div>

            <div>

                <h1>
                    Verificação deslizante
                </h1>

                <p>
                    Arraste o controle até a posição indicada
                </p>

            </div>

        </div>


        <div class="slider-area">

            <div class="slider-instrucao">
                <span>Arraste o controle para a marca verde</span>
            </div>

            <div class="slider-trilha" id="sliderTrilha">

                <div class="slider-zona-alvo" id="sliderZonaAlvo"></div>

                <div class="slider-progresso" id="sliderProgresso"></div>

                <div class="slider-handle" id="sliderHandle">

                    <span class="slider-handle-icone">≡</span>

                </div>

            </div>


            <button
                type="button"
                id="refreshSlider"
                class="refresh-button">

                ↻ Novo desafio

            </button>

        </div>


        <div
            id="mensagem"
            class="mensagem">
        </div>


        <div class="metricas-preview" id="metricasPreview" style="display:none;">

            <h3>📊 Métricas comportamentais</h3>

            <div class="metricas-grid">

                <div class="metrica-item">
                    <span class="metrica-label">Velocidade média</span>
                    <span class="metrica-valor" id="velMedia">—</span>
                </div>

                <div class="metrica-item">
                    <span class="metrica-label">Velocidade máxima</span>
                    <span class="metrica-valor" id="velMax">—</span>
                </div>

                <div class="metrica-item">
                    <span class="metrica-label">Tempo total</span>
                    <span class="metrica-valor" id="tempoTotal">—</span>
                </div>

                <div class="metrica-item">
                    <span class="metrica-label">Mudanças de direção</span>
                    <span class="metrica-valor" id="mudancasDir">—</span>
                </div>

            </div>

        </div>


        <div class="separador"></div>


        <div class="resultado-area">

            <a
                href="/captcha"
                class="resultados-button secundario">

                ✍️ CAPTCHA textual

            </a>

            <a
                href="/resultados"
                class="resultados-button">

                📊 Ver resultados

            </a>

        </div>

    </div>

</div>


<script src="/js/slider.js"></script>

</body>

</html>
