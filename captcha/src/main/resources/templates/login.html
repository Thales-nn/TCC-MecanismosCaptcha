```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - TCC CAPTCHA</title>

    <link rel="stylesheet"
          href="/css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🛡️
        </div>

        <h1>
            TCC CAPTCHA
        </h1>

        <p class="subtitulo">
            Sistema de análise de mecanismos CAPTCHA
        </p>

        <form action="/login"
              method="post">

            <label for="usuario">
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Digite seu usuário"
                required>

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required>

            <button
                type="submit"
                class="login-button">

                Entrar

            </button>

        </form>

        <div class="erro">

            <span th:if="${erro}"
                  th:text="${erro}">
            </span>

        </div>

        <div class="login-info">

            <strong>
                Acesso de teste
            </strong>

            <span>
                Usuário: admin
            </span>

            <span>
                Senha: 1234
            </span>

        </div>

    </div>

</div>

</body>

</html>
```
