# ============================================
# BANCO DE DADOS
# ============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/captcha}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Thales12}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# CAPTCHA TEXTUAL
# ============================================
captcha.texto.comprimento=6
captcha.texto.charset=ABCDEFGHJKLMNPQRSTUVWXYZ23456789
captcha.texto.largura=320
captcha.texto.altura=100
captcha.texto.expiracao-segundos=300
captcha.texto.max-tentativas=10

# ============================================
# CAPTCHA DESLIZANTE
# ============================================
captcha.slider.zona-min=30
captcha.slider.zona-max=85
captcha.slider.tolerancia=3
captcha.slider.armadilha-inicio=95
captcha.slider.tempo-minimo-ms=2000
captcha.slider.expiracao-segundos=300

# ============================================
# AUTENTICACAO
# ============================================
captcha.auth.usuario-padrao=${AUTH_USERNAME:admin}
captcha.auth.senha-padrao=${AUTH_PASSWORD:1234}

# ============================================
# SERVIDOR
# ============================================
server.port=${SERVER_PORT:8080}
